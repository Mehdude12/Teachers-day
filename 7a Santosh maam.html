<!DOCTYPE html>
<html lang="en">
<head>
    <title>HAPPY TEACHER'S DAY 🥳</title>
    <link rel="icon" type="image/png" href="images/santosh-ma'am-logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            background-color: #ffcfcf;
        }
        .para{
            font-size: 21px;
            display: flex;
            flex-direction: column;   /* Stacks elements vertically */
            justify-content: center;  /* Centers them vertically if height is set */
            align-items: center;      /* Centers them horizontally */
            text-align: center;       /* Centers the text inside the paragraphs */
            gap: 15px;      /* Centers vertically */
        }
        .anchor{
            align-self: center;
        }
        .button {
            display: inline-block;
            background-color: #007bff; /* A nice blue color */
            color: white;              /* White text */
            padding: 12px 24px;        /* Spacing inside the button */
            text-decoration: none;     /* Removes the default underline */
            font-family: sans-serif;
            font-weight: bold;
            border-radius: 6px;        /* Slightly rounds the corners */
            transition: 0.2s;          /* Makes the hover effect smooth */
        }

/* Change color when the user hovers over it */
        .button:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }
    </style>
</head>
<body>
    <h1 align="center">HAPPY TEACHERS DAY 🥳</h1>
    <div class="para">
        <p>Hello ma'am. For teachers day we the students of 7A have created this small website to show their gratitude for the hard work and effort you put into teaching us.</p>
        <p>So if you're ready to see the wonderful gratitude of the 7A students click <a href="#">here</a> to see. </p>
        <a href="Dhruvi.html" class="button">READY?</a>
    </div>
</body>
</html>
